[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-cortex"
version = "0.1.0"
description = "A project-owned cognitive layer for long-term AI collaboration."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Project Cortex contributors"}]
dependencies = []

[project.scripts]
aiproj = "aiproj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
